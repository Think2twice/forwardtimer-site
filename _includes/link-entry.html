<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>打开链接 · 织时</title>
  <link rel="stylesheet" href="/assets/link-entry.css">
  <script defer src="/assets/link-entry.js?v=3"></script>
</head>
{% assign route = site.data.links.routes[page.route] %}
<body data-enabled="{{ route.enabled }}" data-target="{{ route.url | escape }}"
      data-hosts="{{ site.data.links.allowedHosts | join: ',' | escape }}"
      data-mail="{{ site.data.links.allowedMailtoRecipients | join: ',' | escape }}">
  <main>
    <a class="brand" href="/">织时 · Woven Hours</a>
    <h1 id="entry-title">{{ route.title | escape }}</h1>
    <p id="entry-status" role="status" aria-live="polite">正在打开；若无法跳转，可前往支持页。</p>
    <div class="actions">
      <a id="entry-destination" class="action primary" rel="noreferrer" hidden>继续打开</a>
      <button id="entry-retry" type="button" hidden>重试</button>
      <a class="action" href="/support/">前往支持页</a>
    </div>
    <noscript><p>自动跳转需要 JavaScript。你也可以直接前往支持页。</p></noscript>
  </main>
</body>
</html>
